<style>
*,*::before,*::after{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}

/* Layout: iOS-style navigation stack. Large title, "you say" bubble, inset grouped list of customer replies. */
:root{
  --bg:#f2f2f7; --cell:#ffffff; --label:#000000; --sec:#6c6c70; --sep:rgba(60,60,67,.18);
  --tint:#007aff; --tint-on:#ffffff; --green:#34c759; --orange:#ff9500; --red:#ff3b30; --indigo:#5856d6; --teal:#30b0c7; --fill:rgba(118,118,128,.12);
  --bar:rgba(249,249,249,.86);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
  --fs:1.12rem;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000; --cell:#1c1c1e; --label:#ffffff; --sec:#98989f; --sep:rgba(84,84,88,.6);
  --tint:#0a84ff; --tint-on:#ffffff; --green:#30d158; --orange:#ff9f0a; --red:#ff453a; --indigo:#5e5ce6; --teal:#40c8e0; --fill:rgba(118,118,128,.24);
  --bar:rgba(22,22,24,.82); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --cell:#1c1c1e; --label:#ffffff; --sec:#98989f; --sep:rgba(84,84,88,.6);
  --tint:#0a84ff; --tint-on:#ffffff; --green:#30d158; --orange:#ff9f0a; --red:#ff453a; --indigo:#5e5ce6; --teal:#40c8e0; --fill:rgba(118,118,128,.24);
  --bar:rgba(22,22,24,.82); color-scheme:dark}
html,body{background:var(--bg)}
body{color:var(--label);font-family:var(--font);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bar)}
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid var(--sep)}
.nav .in{max-width:640px;margin:0 auto;padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));padding-block:0;height:44px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
.nb{font:400 17px var(--font);color:var(--tint);background:none;border:0;padding:8px;display:flex;align-items:center;gap:2px;cursor:pointer}
.nb:disabled{opacity:.3}
.nb.r{justify-self:end}
.nt{font-weight:600;font-size:17px;display:flex;align-items:center;gap:6px}
.chip{font-size:12px;font-weight:600;color:#fff;border-radius:999px;padding:2px 8px}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px 40px;display:flex;flex-direction:column;gap:22px}
.lt{font-size:2rem;font-weight:700;letter-spacing:-.01em;margin:6px 0 0;text-wrap:balance;line-height:1.2}
.crumb{font-size:13px;color:var(--sec);margin-top:2px;min-width:0;overflow-wrap:anywhere}
.sec-h{font-size:13px;color:var(--sec);margin:0 0 6px 16px;letter-spacing:.01em}
.bubble{background:var(--tint);color:var(--tint-on);border-radius:20px 20px 6px 20px;padding:14px 16px;font-size:var(--fs);line-height:1.7;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.bubble p{margin:0}
.bubble p+p{margin-top:.6em}
.bubble.end{background:var(--green)}
.hint{display:flex;gap:10px;background:var(--cell);border-radius:12px;padding:12px 14px;font-size:14px;color:var(--sec);line-height:1.55}
.hint b{color:var(--orange);font-weight:600;white-space:nowrap}
.list{background:var(--cell);border-radius:12px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;padding:0 0 0 16px;min-height:52px;text-align:left;font:400 17px var(--font);color:var(--label);cursor:pointer}
.row .t{flex:1;padding:13px 0;border-bottom:.5px solid var(--sep);display:flex;align-items:center;gap:8px;min-width:0}
.row:last-child .t{border-bottom:0}
.row .tx{flex:1;min-width:0}
.row .tx small{display:block;color:var(--sec);font-size:13px;margin-top:1px}
.row .chev{color:var(--sec);opacity:.6;padding-right:14px;font-size:18px}
.row:active{background:var(--fill)}
.row:focus-visible,.nb:focus-visible,.seg button:focus-visible{outline:2px solid var(--tint);outline-offset:-2px}
.ic{width:30px;height:30px;border-radius:7px;display:grid;place-items:center;color:#fff;font-size:15px;font-weight:700;flex:none}
.foot{font-size:12px;color:var(--sec);margin:0 16px;line-height:1.6}
.seg{display:flex;background:var(--fill);border-radius:9px;padding:2px;align-self:center}
.seg button{font:500 13px var(--font);border:0;background:none;color:var(--label);padding:6px 14px;border-radius:7px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--cell);box-shadow:0 1px 3px rgba(0,0,0,.12)}
@media (prefers-reduced-motion:no-preference){.page{animation:push .22s cubic-bezier(.2,.8,.2,1)}@keyframes push{from{transform:translateX(18px)}to{transform:none}}}
.search input{width:100%;font:400 17px var(--font);padding:10px 14px;border-radius:10px;border:0;background:var(--fill);color:var(--label);-webkit-appearance:none;appearance:none}
.search input:focus{outline:2px solid var(--tint)}
details.more{background:none}
details.more summary{list-style:none;cursor:pointer;font-size:15px;color:var(--tint);padding:4px 16px 10px;font-weight:500}
details.more summary::-webkit-details-marker{display:none}
details.more summary::before{content:"＋ "}
details.more[open] summary::before{content:"− "}
</style>
</head>

<script>
/* ===== アイコン ===== */
const C={y:["var(--green)","✓"],n:["var(--red)","✕"],q:["var(--orange)","?"],p:["var(--tint)","→"],m:["#8e8e93","…"],
  home:["var(--tint)","家"],apt:["#af52de","マ"],office:["var(--indigo)","社"],shop:["var(--teal)","店"],in:["var(--green)","☎"]};
const KIND={home:"戸建て",apt:"マンション",office:"会社",shop:"お店"};
/* 値は そのまま or {home,apt,office,shop}（無い種類は home → apt の順で代用） */
const N={
/* ---------- スタート ---------- */
 start:{title:"配達先は？",
  hint:"電話の前に：宛名・住所・部屋番号を確認。周りがうるさくない場所でかける。",
  opts:[["戸建て（一軒家）","home","call","home"],["マンション・アパート","apt","call","apt"],["会社・オフィス","office","call","office"],["お店","shop","call","shop"],["お客様から電話がかかってきた","in","incoming","home"]]},

/* ---------- 電話をかける ---------- */
 other_person:{title:{home:"家族が出た",apt:"家族が出た",office:"別の人が出た",shop:"店員さんが出た"},
  say:{home:["〇〇様宛てのお荷物をお届けに伺ったのですが、代わりにお受け取りいただくことはできますか？"],
       office:["〇〇様宛てのお荷物なのですが、代わりにお受け取りいただくことはできますか？受付やご担当の方でも大丈夫です。"],

  hint:"同じ住所の人なら受け取ってもらえることが多い。受け取った人の名前をメモ。",
  opts:{home:[["受け取れる","y","home_yes"],["本人は不在・誰もいない","n","away"],["本人に聞いてみる","q","check_later"]],
        office:[["受け取れる","y","office_recv"],["その人はもういない（退職など）","n","office_gone"],["部署が違う","q","office_dept"],["本人に聞いてみる","q","check_later"]],
        shop:[["受け取れる","y","shop_yes"],["店長がいないと無理","n","away"],["本人に聞いてみる","q","check_later"]]}},
 check_later:{title:"本人に確認する",say:["ありがとうございます。近くを回っていますので、もし置き場所などが決まりましたら、このお電話番号に折り返していただけますか？","ただ、折り返しが間に合わない場合は、今回は持ち帰りになることがあります。"],
  hint:"折り返しを待てるかはルート次第。待ちすぎない。",
  opts:[["わかった","y","end_try"],["置いていいって","y","place"]]},

/* ---------- 在宅確認 ---------- */
 call:{title:"電話をかける",
  say:{home:["もしもし、私Amazonの配達の者ですが、今中にいらっしゃいますでしょうか？"],
       office:["もしもし、私Amazonの配達の者ですが、今会社の中にいらっしゃいますでしょうか？"],
       shop:["もしもし、私Amazonの配達の者ですが、今お店の中にいらっしゃいますでしょうか？"]},
  hint:{home:"アプリからかけているので相手は本人。最初の一言で用件まで言い切る。",apt:"アプリからかけているので相手は本人。オートロックの場合は開けてもらえるかも確認。",office:"本人でなくても、受付や同僚が受け取れることが多い。",shop:"開店前・仕込み中・夜営業など事情がさまざま。手短に。"},
  opts:{home:[["いるよ","y","home_yes"],["いない","n","away"],["すぐ戻る・今向かってる","q","soon"],["別の場所に持ってきて","q","redirect"],["何の荷物？頼んでない","q","unknown"],["家族・従業員が出た","p","other_person"],["出ない・留守電","m","vm"]],
        apt:[["いるよ","y","apt_yes"],["いない","n","away"],["すぐ戻る・今向かってる","q","soon"],["宅配ボックスに入れて","y","box"],["管理人さんに預けて","q","neighbor"],["何の荷物？頼んでない","q","unknown"],["家族・従業員が出た","p","other_person"],["出ない・留守電","m","vm"]],
        office:[["受付・他の人が受け取る","y","office_recv"],["本人が取りに行く","y","office_self"],["今日は誰もいない","n","away"],["今日は休み","n","closed"],["入館手続きが必要","q","office_gate"],["何の荷物？頼んでない","q","unknown"],["家族・従業員が出た","p","other_person"],["出ない・留守電","m","vm"]],
        shop:[["いるよ","y","shop_yes"],["開店前・今はいない","n","away"],["すぐ戻る","q","soon"],["裏口に回って","y","shop_back"],["夜しか開いていない","q","night"],["今日は定休日","n","closed"],["何の荷物？頼んでない","q","unknown"],["家族・従業員が出た","p","other_person"],["出ない・留守電","m","vm"]]}},

/* ---------- いた ---------- */
 home_yes:{title:"家にいた",say:["失礼しました！これからもう一度インターホンを押しますので、出ていただけますか？"],
  hint:"インターホンの故障や聞こえなかったケースが多いです。",
  opts:[["わかった","y","end_ok"],["インターホン壊れてる","q","bell"],["今は出られない","n","cant"],["寝てた・赤ちゃんがいる","q","quiet"]]},
 apt_yes:{title:"家にいた",say:["失礼しました！これからもう一度、部屋番号でお呼び出しします。オートロックを開けていただけますか？"],
  hint:"部屋番号を復唱して間違いがないか確認。",
  opts:[["わかった","y","end_ok"],["部屋番号が違う","q","wrong_room"],["インターホン壊れてる","q","bell"],["今は出られない","n","cant"],["寝てた・赤ちゃんがいる","q","quiet"]]},
 quiet:{title:"静かにしてほしい",say:["承知しました。インターホンは鳴らさずに、ドアの前に着いたらこのお電話でお知らせしますね。"],
  opts:[["OK","y","end_ok"],["置いといて","y","place"]]},
 bell:{title:"インターホンが鳴らない",say:["承知しました。では、ドアの前に着いたらこのお電話か、ノックでお知らせしますね。"],

 wrong_room:{title:"部屋番号が違う",say:["大変失礼しました。お部屋番号を伺ってもよろしいですか？","（復唱）〇〇〇号室ですね。ありがとうございます。すぐに伺います。"],

       office:["承知しました。入口の前や受付などに置かせていただいてもよろしいですか？"],
       shop:["お忙しいところすみません。レジ横や入口の前など、置かせていただいてよい場所はありますか？"]},
  opts:[["置いていいよ","y","place"],["置かないで","n","no_okihai"],["◯分後なら出られる","q","soon"]]},

 office_recv:{title:"受付で受け取り",say:["ありがとうございます。受付（〇〇階）にお持ちすればよろしいですか？","受け取っていただく方のお名前を伺ってもよろしいでしょうか？"],
  hint:"受け取った人の名前をメモ。ビルの入館ルールにも従う。",
  opts:[["わかった","y","end_ok"],["受付はない","q","office_self"],["入館手続きが必要","q","office_gate"]]},
 office_self:{title:"取りに来てくれる",say:["ありがとうございます。では〇〇（入口・ロビーなど）でお待ちしていますね。"],
  hint:"待つ時間はルート次第。5分以上かかりそうなら別の方法を相談。",
  opts:[["OK","y","end_ok"],["時間がかかる","q","soon"]]},
 office_gate:{title:"入館手続きが必要",say:["承知しました。入館の受付は〇〇（1階の防災センターなど）でよろしいですか？","手続きに時間がかかる場合は、1階まで取りに来ていただくことはできますか？"],

  opts:[["取りに来てくれる","y","office_self"],["手続きして上がって","y","end_ok"],["どちらも無理","n","away"]]},

 shop_back:{title:"裏口・別の入口",say:["承知しました。裏口はどちら側になりますか？（復唱）〇〇側の、〇〇の扉ですね。すぐに伺います。"],

 soon_short:{title:"数分で戻る",say:["近くを回っていますので、このあともう一度伺えるか試してみますね。","ただ、お約束はできないので、もし置いてよい場所があれば置き配にもできますが、いかがですか？"],

  opts:[["わかった","y","end_try"],["置いていいよ","y","place"],["怒っている","n","angry"]]},
 away:{title:"不在だった",

        apt:[["置いていいよ","y","place"],["宅配ボックスに入れて","y","box"],["置かないで","n","no_okihai"],["管理人さんに預けて","q","neighbor"],["別の場所に持ってきて","q","redirect"],["今日中にもう一度来て","q","today"],["夜に持ってきて","q","night"],["明日・土日にして","q","day"]],
        office:[["置いていいよ","y","place"],["置かないで","n","no_okihai"],["営業時間内に持ってこい","q","bizhours"],["何回も伝えてる","n","repeat"],["隣の会社に預けて","q","neighbor"],["明日・平日にして","q","day"]],
        shop:[["置いていいよ","y","place"],["置かないで","n","no_okihai"],["営業時間内に持ってこい","q","bizhours"],["夜しか開いていない","q","night"],["何回も伝えてる","n","repeat"],["隣のお店に預けて","q","neighbor"],["明日にして","q","day"]]}},
 closed:{title:{office:"今日は休み",shop:"今日は定休日"},

};
/* どの画面からでも出せる「ほかの返事」 */
const EXTRA=[["怒っている","n","angry"],["何回も伝えてる","n","repeat"],["サポートってどこ？","q","cs_where"],["なんで電話するの","q","why_call"],["何の荷物？頼んでない","q","unknown"],["詐欺？と疑われた","q","scam"],["聞き取れない・ご高齢","m","slow"],["外国語の人","m","english"],["名前を教えろ","q","name"],["上司を出せ","n","boss"],["話し中・電話が切れた","m","hangup"]];

let stack=[{id:"start"}], kind=null, fs=1.12, q="";
try{const v=localStorage.getItem("flow_fs");if(v)fs=+v}catch(e){}
const app=document.getElementById("app");
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function pick(v,k){k=k||kind;if(v==null)return null;if(Array.isArray(v)||typeof v==="string")return v;return v[k]||(k==="apt"&&v.home)||v.home||v.apt||v.shop||v.office}
function rows(list,attr){return '<div class="list">'+list.map((o,i)=>'<button class="row" type="button" '+attr+'="'+i+'"><span class="ic" style="background:'+C[o[1]][0]+'">'+C[o[1]][1]+'</span><span class="t"><span class="tx">'+esc(o[0])+(o[4]?'<small>'+esc(o[4])+'</small>':'')+'</span><span class="chev">›</span></span></button>').join("")+'</div>'}
function go(o){stack.push(o[3]?{id:o[2],kind:o[3]}:{id:o[2]});q="";render();window.scrollTo(0,0)}
function searchList(){
  const k=kind||"home", out=[], t=q.trim();
  for(const id in N){if(id==="start")continue;const n=N[id];const title=pick(n.title,k)||"";const say=(pick(n.say,k)||[]).join(" ");
    if(title.includes(t)||say.includes(t))out.push([title,n.end?"p":"q",id,null,say.slice(0,34)+(say.length>34?"…":"")])}
  return out.slice(0,30);
}
function render(){
  const top=stack[stack.length-1]; kind=null;
  for(const s of stack){if(s.kind)kind=s.kind}
  const n=N[top.id], say=pick(n.say), hint=pick(n.hint), opts=pick(n.opts), title=pick(n.title);
  document.documentElement.style.setProperty("--fs",fs+"rem");
  document.getElementById("navt").innerHTML='配達電話'+(kind&&top.id!=="start"?'<span class="chip" style="background:'+C[kind][0]+'">'+KIND[kind]+'</span>':'');
  let h='<div><h1 class="lt">'+esc(title)+'</h1>';
  if(stack.length>2)h+='<div class="crumb">'+stack.slice(1,-1).map(s=>esc(pick(N[s.id].title))).join(" › ")+'</div>';
  h+='</div>';
  if(top.id==="start")h+='<div class="search"><input id="q" type="search" placeholder="セリフを検索（例：営業時間、置き配）" value="'+esc(q)+'" autocomplete="off"></div>';
  if(top.id==="start"&&q.trim()){
    const r=searchList(); h+='<div><p class="sec-h">検索結果 '+r.length+'件</p>'+(r.length?rows(r,"data-s"):'<div class="hint"><span>見つかりませんでした。別の言葉で探してみてください。</span></div>')+'</div>';
  }else{
    if(say)h+='<div><p class="sec-h">あなたが言う</p><div class="bubble'+(n.end?" end":"")+'">'+say.map(s=>"<p>"+esc(s)+"</p>").join("")+'</div></div>';
    if(hint)h+='<div class="hint"><b>ポイント</b><span>'+esc(hint)+'</span></div>';
    if(opts){h+='<div><p class="sec-h">'+(top.id==="start"?"配達先":"お客様の返事")+'</p>'+rows(opts,"data-i")+'</div>';}
    else{h+='<div class="list"><button class="row" type="button" id="again"><span class="ic" style="background:var(--tint)">↺</span><span class="t"><span class="tx">次の電話へ（最初から）</span><span class="chev">›</span></span></button></div>';}
    if(top.id!=="start"&&!n.end){
      const ex=EXTRA.filter(e=>e[2]!==top.id&&!(opts||[]).some(o=>o[2]===e[2]));
      h+='<details class="more"><summary>ほかの返事（困ったとき）</summary>'+rows(ex,"data-x")+'</details>';
    }
  }
  h+='<div class="seg" role="group" aria-label="文字サイズ"><button type="button" data-f="1" aria-pressed="'+(fs<1.1)+'">小</button><button type="button" data-f="1.12" aria-pressed="'+(fs>=1.1&&fs<1.3)+'">標準</button><button type="button" data-f="1.35" aria-pressed="'+(fs>=1.3)+'">大</button></div>';
  h+='<p class="foot">※Amazonの配達ルール（時間指定・再配達・置き配）やアプリの画面は変わることがあります。所属の配送会社やビルのルールが優先です。2026年10月時点。</p>';
  app.innerHTML=h;
  app.classList.remove("page");void app.offsetWidth;app.classList.add("page");
  app.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>go(opts[+b.dataset.i]));
  app.querySelectorAll("[data-x]").forEach(b=>{const ex=EXTRA.filter(e=>e[2]!==top.id&&!(opts||[]).some(o=>o[2]===e[2]));b.onclick=()=>go(ex[+b.dataset.x])});
  if(top.id==="start"&&q.trim()){const r=searchList();app.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{stack.push({id:r[+b.dataset.s][2],kind:"home"});q="";render();window.scrollTo(0,0)})}
  const qi=document.getElementById("q");
  if(qi){qi.oninput=()=>{q=qi.value;const pos=qi.selectionStart;render();const n2=document.getElementById("q");n2.focus();try{n2.setSelectionRange(pos,pos)}catch(e){}}}
  const a=document.getElementById("again");if(a)a.onclick=reset;
  app.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{fs=+b.dataset.f;try{localStorage.setItem("flow_fs",fs)}catch(e){}render()});
  document.getElementById("back").disabled=stack.length<2;
}
function reset(){stack=[{id:"start"}];q="";render();window.scrollTo(0,0)}
document.getElementById("back").onclick=()=>{if(stack.length>1){stack.pop();render();window.scrollTo(0,0)}};
document.getElementById("home").onclick=reset;
render();
</script>

<script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}))}</script>
</body>
</html>
